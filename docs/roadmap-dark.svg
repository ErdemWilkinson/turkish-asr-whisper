<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 649" width="860" height="649" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="648" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">Roadmap for all three models</text><text x="20" y="49" font-size="12" fill="#94928b">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#2c2c2a"/><text x="20" y="130" font-size="15" font-weight="700" fill="#ffffff">OCR</text><rect x="122" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="116" width="4" height="73" rx="2" fill="#d95926"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Train P and S longer on the GPU</text><rect x="130" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="134" y="164" font-size="11.5" fill="#c3c2b7">Gate: P beats S by ≥ 2 points on</text><text x="134" y="179" font-size="11.5" fill="#c3c2b7">TS-TR</text><rect x="365" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Prune D to tiny's size (171 KB)</text><rect x="373" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="164" font-size="11.5" fill="#c3c2b7">Gate: held-out &gt; 64.4%, TS-TR &gt;</text><text x="377" y="179" font-size="11.5" fill="#c3c2b7">32.6%</text><rect x="365" y="197" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="219" font-size="12.5" font-weight="600" fill="#ffffff">Quantization-aware training for</text><text x="377" y="236" font-size="12.5" font-weight="600" fill="#ffffff">the pruned model</text><rect x="373" y="247" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="262" font-size="11.5" fill="#c3c2b7">Gate: int8 loses ≤ 2 points on</text><text x="377" y="277" font-size="11.5" fill="#c3c2b7">every set</text><rect x="607" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Publish a 298 KB model</text><rect x="615" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="164" font-size="11.5" fill="#c3c2b7">Gate: the gates before it, plus</text><text x="619" y="179" font-size="11.5" fill="#c3c2b7">an ESP32-P4 measurement</text><line x1="20" x2="840" y1="299" y2="299" stroke="#2c2c2a"/><text x="20" y="321" font-size="15" font-weight="700" fill="#ffffff">VoxHOD</text><rect x="122" y="307" width="233" height="90" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="307" width="4" height="90" rx="2" fill="#d95926"/><text x="134" y="329" font-size="12.5" font-weight="600" fill="#ffffff">Train with many more empty and</text><text x="134" y="346" font-size="12.5" font-weight="600" fill="#ffffff">hard-negative tiles</text><rect x="130" y="357" width="217" height="38" rx="4" fill="#232321"/><text x="134" y="372" font-size="11.5" fill="#c3c2b7">Gate: precision &gt; 20.4% at recall</text><text x="134" y="387" font-size="11.5" fill="#c3c2b7">≥ 83%</text><rect x="365" y="307" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="329" font-size="12.5" font-weight="600" fill="#ffffff">Find small people more often</text><rect x="373" y="340" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="355" font-size="11.5" fill="#c3c2b7">Gate: ≥ 85% of 8-16 px people,</text><text x="377" y="370" font-size="11.5" fill="#c3c2b7">same size</text><rect x="607" y="307" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="329" font-size="12.5" font-weight="600" fill="#ffffff">More varied aerial data</text><rect x="615" y="340" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="355" font-size="11.5" fill="#c3c2b7">Gate: WiSARD recall &gt; 61.3%</text><text x="619" y="370" font-size="11.5" fill="#c3c2b7">without losing HERIDAL</text><line x1="20" x2="840" y1="409" y2="409" stroke="#2c2c2a"/><text x="20" y="431" font-size="15" font-weight="700" fill="#ffffff">ASR</text><rect x="122" y="417" width="233" height="73" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="417" width="4" height="73" rx="2" fill="#d95926"/><text x="134" y="439" font-size="12.5" font-weight="600" fill="#ffffff">Continue v11 on the GPU</text><rect x="130" y="450" width="217" height="38" rx="4" fill="#232321"/><text x="134" y="465" font-size="11.5" fill="#c3c2b7">Gate: CER below 40% on both test</text><text x="134" y="480" font-size="11.5" fill="#c3c2b7">sets</text><rect x="365" y="417" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="439" font-size="12.5" font-weight="600" fill="#ffffff">Wide teacher, 64k-parameter</text><text x="377" y="456" font-size="12.5" font-weight="600" fill="#ffffff">student</text><rect x="373" y="467" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="482" font-size="11.5" fill="#c3c2b7">Gate: the student beats v11 at</text><text x="377" y="497" font-size="11.5" fill="#c3c2b7">the same size</text><rect x="607" y="417" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="439" font-size="12.5" font-weight="600" fill="#ffffff">Record the command dataset</text><rect x="615" y="450" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="465" font-size="11.5" fill="#c3c2b7">Gate: the command-classifier</text><text x="619" y="480" font-size="11.5" fill="#c3c2b7">acceptance threshold</text><line x1="20" x2="840" y1="519" y2="519" stroke="#2c2c2a"/><text x="20" y="541" font-size="15" font-weight="700" fill="#ffffff">Infra</text><rect x="122" y="527" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="134" y="549" font-size="12.5" font-weight="600" fill="#ffffff">GPU training in WSL2</text><rect x="130" y="560" width="217" height="38" rx="4" fill="#232321"/><text x="134" y="575" font-size="11.5" fill="#c3c2b7">Done 2026-11-07: 155 s per epoch</text><text x="134" y="590" font-size="11.5" fill="#c3c2b7">instead of about 50 min</text><rect x="365" y="527" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="549" font-size="12.5" font-weight="600" fill="#ffffff">Feed the GPU faster</text><rect x="373" y="560" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="575" font-size="11.5" fill="#c3c2b7">Gate: epoch below 100 s (GPU is</text><text x="377" y="590" font-size="11.5" fill="#c3c2b7">~30% busy)</text><rect x="607" y="527" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="549" font-size="12.5" font-weight="600" fill="#ffffff">Check device output against the</text><text x="619" y="566" font-size="12.5" font-weight="600" fill="#ffffff">PC</text><rect x="615" y="577" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="592" font-size="11.5" fill="#c3c2b7">Gate: same results on device and</text><text x="619" y="607" font-size="11.5" fill="#c3c2b7">PC</text></svg>