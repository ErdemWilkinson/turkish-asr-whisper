<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 238" width="860" height="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="237" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">ASR roadmap</text><text x="20" y="49" font-size="12" fill="#7d7b75">Rule: the device model never grows; a wider model may only serve as a teacher. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#e1e0d9"/><text x="20" y="130" font-size="15" font-weight="700" fill="#0b0b0b">ASR</text><rect x="122" y="116" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.6"/><rect x="122" y="116" width="4" height="73" rx="2" fill="#eb6834"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Continue v11 on the GPU</text><rect x="130" y="149" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="134" y="164" font-size="11.5" fill="#52514e">Gate: CER below 40% on both test</text><text x="134" y="179" font-size="11.5" fill="#52514e">sets</text><rect x="365" y="116" width="233" height="90" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Wide teacher, 64k-parameter</text><text x="377" y="155" font-size="12.5" font-weight="600" fill="#0b0b0b">student</text><rect x="373" y="166" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="377" y="181" font-size="11.5" fill="#52514e">Gate: the student beats v11 at</text><text x="377" y="196" font-size="11.5" fill="#52514e">the same size</text><rect x="607" y="116" width="233" height="90" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Record the command dataset,</text><text x="619" y="155" font-size="12.5" font-weight="600" fill="#0b0b0b">train the command classifier</text><rect x="615" y="166" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="181" font-size="11.5" fill="#52514e">Gate: the acceptance threshold in</text><text x="619" y="196" font-size="11.5" fill="#52514e">this README</text></svg>